[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daso"
version = "0.1.0"
description = "Deployment-aware selection and optimization of heterogeneous compression policies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.5"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
eval = ["transformers>=4.45", "datasets>=2.20", "safetensors>=0.4", "lm-eval==0.4.12"]
vision = ["transformers>=4.45", "safetensors>=0.4", "timm>=1.0", "torchvision>=0.20", "pillow>=10", "scikit-learn>=1.5"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
